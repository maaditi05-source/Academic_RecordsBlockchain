# NIT Warangal Academic Records Blockchain — ConfigTx
# 12-System Distributed Architecture
# Orderer: 3-node Raft HA (orderer1, orderer2, orderer3)
# Peers: 8 peers across 3 organizations

Organizations:
  - &OrdererOrg
      Name: OrdererOrg
      ID: OrdererMSP
      MSPDir: ../organizations/ordererOrganizations/nitw.edu/msp
      Policies:
        Readers:
          Type: Signature
          Rule: "OR('OrdererMSP.member')"
        Writers:
          Type: Signature
          Rule: "OR('OrdererMSP.member')"
        Admins:
          Type: Signature
          Rule: "OR('OrdererMSP.admin')"
      OrdererEndpoints:
        - orderer1.nitw.edu:7050
        - orderer2.nitw.edu:8050
        - orderer3.nitw.edu:9050

  - &NITWarangal
      Name: NITWarangalMSP
      ID: NITWarangalMSP
      MSPDir: ../organizations/peerOrganizations/nitwarangal.nitw.edu/msp
      Policies:
        Readers:
          Type: Signature
          Rule: "OR('NITWarangalMSP.admin', 'NITWarangalMSP.peer', 'NITWarangalMSP.client')"
        Writers:
          Type: Signature
          Rule: "OR('NITWarangalMSP.admin', 'NITWarangalMSP.client')"
        Admins:
          Type: Signature
          Rule: "OR('NITWarangalMSP.admin')"
        Endorsement:
          Type: Signature
          Rule: "OR('NITWarangalMSP.peer')"
      AnchorPeers:
        # Anchor peer: peer0 on Node 04
        - Host: peer0.nitwarangal.nitw.edu
          Port: 7051

  - &Departments
      Name: DepartmentsMSP
      ID: DepartmentsMSP
      MSPDir: ../organizations/peerOrganizations/departments.nitw.edu/msp
      Policies:
        Readers:
          Type: Signature
          Rule: "OR('DepartmentsMSP.admin', 'DepartmentsMSP.peer', 'DepartmentsMSP.client')"
        Writers:
          Type: Signature
          Rule: "OR('DepartmentsMSP.admin', 'DepartmentsMSP.client')"
        Admins:
          Type: Signature
          Rule: "OR('DepartmentsMSP.admin')"
        Endorsement:
          Type: Signature
          Rule: "OR('DepartmentsMSP.peer')"
      AnchorPeers:
        # Anchor peer: CSE peer on Node 06
        - Host: peer0.cse.departments.nitw.edu
          Port: 9051

  - &Verifiers
      Name: VerifiersMSP
      ID: VerifiersMSP
      MSPDir: ../organizations/peerOrganizations/verifiers.nitw.edu/msp
      Policies:
        Readers:
          Type: Signature
          Rule: "OR('VerifiersMSP.admin', 'VerifiersMSP.peer', 'VerifiersMSP.client')"
        Writers:
          Type: Signature
          Rule: "OR('VerifiersMSP.admin', 'VerifiersMSP.client')"
        Admins:
          Type: Signature
          Rule: "OR('VerifiersMSP.admin')"
        Endorsement:
          Type: Signature
          Rule: "OR('VerifiersMSP.peer')"
      AnchorPeers:
        # Anchor peer: peer0 on Node 10
        - Host: peer0.verifiers.nitw.edu
          Port: 11051

Capabilities:
  Channel: &ChannelCapabilities
    V2_0: true
  Orderer: &OrdererCapabilities
    V2_0: true
  Application: &ApplicationCapabilities
    V2_5: true

Application: &ApplicationDefaults
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    LifecycleEndorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Endorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
  Capabilities:
    <<: *ApplicationCapabilities

Orderer: &OrdererDefaults
  OrdererType: etcdraft
  # All 3 orderers listed — SDK and peers use this to find the ordering service
  Addresses:
    - orderer1.nitw.edu:7050
    - orderer2.nitw.edu:8050
    - orderer3.nitw.edu:9050
  EtcdRaft:
    # 3 consenters = Raft quorum of 2 — tolerates 1 orderer failure
    Consenters:
      - Host: orderer1.nitw.edu
        Port: 7050
        ClientTLSCert: ../organizations/ordererOrganizations/nitw.edu/orderers/orderer1.nitw.edu/tls/server.crt
        ServerTLSCert: ../organizations/ordererOrganizations/nitw.edu/orderers/orderer1.nitw.edu/tls/server.crt
      - Host: orderer2.nitw.edu
        Port: 8050
        ClientTLSCert: ../organizations/ordererOrganizations/nitw.edu/orderers/orderer2.nitw.edu/tls/server.crt
        ServerTLSCert: ../organizations/ordererOrganizations/nitw.edu/orderers/orderer2.nitw.edu/tls/server.crt
      - Host: orderer3.nitw.edu
        Port: 9050
        ClientTLSCert: ../organizations/ordererOrganizations/nitw.edu/orderers/orderer3.nitw.edu/tls/server.crt
        ServerTLSCert: ../organizations/ordererOrganizations/nitw.edu/orderers/orderer3.nitw.edu/tls/server.crt
    Options:
      TickInterval: 500ms
      ElectionTick: 10
      HeartbeatTick: 1
      MaxInflightBlocks: 5
      SnapshotIntervalSize: 16 MB
  BatchTimeout: 2s
  BatchSize:
    MaxMessageCount: 10
    AbsoluteMaxBytes: 99 MB
    PreferredMaxBytes: 512 KB
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"

Channel: &ChannelDefaults
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *ChannelCapabilities

Profiles:
  AcademicRecordsGenesis:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *OrdererOrg
      Capabilities: *OrdererCapabilities
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *NITWarangal
        - *Departments
        - *Verifiers
      Capabilities: *ApplicationCapabilities

  AcademicRecordsChannel:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *OrdererOrg
      Capabilities: *OrdererCapabilities
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *NITWarangal
        - *Departments
        - *Verifiers
      Capabilities:
        <<: *ApplicationCapabilities
