# NIT Warangal Academic Records Blockchain — Crypto Configuration
# 13-System Distributed Architecture
#
# ORDERER CLUSTER: 3-node Raft HA
#   orderer1.nitw.edu → Node 01
#   orderer2.nitw.edu → Node 02
#   orderer3.nitw.edu → Node 03
#
# PEER ORGS:
#   NITWarangal: peer0 (admin), peer1 (exam section), peer2 (dean) → Nodes 04-06
#   Departments: peer0.cse (HOD), peer1.cse (faculty), peer0.ece (HOD), peer1.ece (faculty) → Nodes 07-10
#   Verifiers:   peer0 (primary), peer1 (secondary) → Nodes 11-12

OrdererOrgs:
  - Name: Orderer
    Domain: nitw.edu
    EnableNodeOUs: true
    Specs:
      - Hostname: orderer1   # Node 01 — Primary Raft leader
      - Hostname: orderer2   # Node 02 — Raft follower
      - Hostname: orderer3   # Node 03 — Raft follower

PeerOrgs:
  - Name: NITWarangal
    Domain: nitwarangal.nitw.edu
    EnableNodeOUs: true
    Template:
      Count: 3              # peer0 (admin/04) + peer1 (exam/05) + peer2 (dean/06)
    Users:
      Count: 5              # admin, exam_section, dean_academic, student, default

  - Name: Departments
    Domain: departments.nitw.edu
    EnableNodeOUs: true
    Specs:
      - Hostname: peer0.cse  # Node 07 — CSE HOD (anchor peer)
      - Hostname: peer1.cse  # Node 08 — CSE Faculty Advisor
      - Hostname: peer0.ece  # Node 09 — ECE HOD
      - Hostname: peer1.ece  # Node 10 — ECE Faculty Advisor
    Users:
      Count: 6              # admin, faculty_cse, hod_cse, faculty_ece, hod_ece, default

  - Name: Verifiers
    Domain: verifiers.nitw.edu
    EnableNodeOUs: true
    Template:
      Count: 2              # peer0 (primary/11) + peer1 (secondary/12)
    Users:
      Count: 3              # admin, verifier, default
