# Copyright NIT Warangal Academic Records Blockchain Network
# Docker Compose: NITWarangal Organization (Machine 2)
# Usage: docker-compose -f docker-compose-nitwarangal.yaml up -d

version: '3.7'

volumes:
  peer0.nitwarangal.nitw.edu:


networks:
  nitw:
    name: ${DOCKER_NETWORK_NAME:-fabric_nitw}

services:
  ca_nitwarangal:
    image: hyperledger/fabric-ca:latest
    labels:
      service: hyperledger-fabric
    command: sh -c 'fabric-ca-server start -b ${CA_ADMIN_USER:-admin}:${CA_ADMIN_PASSWORD:-adminpw} -d'
    environment:
      - FABRIC_CA_SERVER_CA_NAME=ca-nitwarangal
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=${NITWARANGAL_CA_PORT:-8054}
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:${NITWARANGAL_CA_OPERATIONS_PORT:-18054}
      - FABRIC_CA_SERVER_CSR_HOSTS=ca-nitwarangal,localhost,${NITWARANGAL_HOST:-localhost}
      - FABRIC_CA_SERVER_CSR_CN=ca-nitwarangal.nitw.edu
    ports:
      - "${NITWARANGAL_CA_PORT:-8054}:${NITWARANGAL_CA_PORT:-8054}"
      - "${NITWARANGAL_CA_OPERATIONS_PORT:-18054}:${NITWARANGAL_CA_OPERATIONS_PORT:-18054}"
    volumes:
      - ../organizations/fabric-ca/nitwarangal:/etc/hyperledger/fabric-ca-server
    container_name: ca_nitwarangal
    extra_hosts:
      - "orderer.nitw.edu:${ORDERER_HOST:-host-gateway}"
      - "peer0.departments.nitw.edu:${DEPARTMENTS_HOST:-host-gateway}"
      - "peer0.verifiers.nitw.edu:${VERIFIERS_HOST:-host-gateway}"
    networks:
      - nitw

  couchdb0:
    container_name: couchdb0
    image: couchdb:3.3
    environment:
      - COUCHDB_USER=${COUCHDB_USER:-admin}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD:-adminpw}
    ports:
      - "${NITWARANGAL_COUCHDB_PORT:-5984}:5984"
    networks:
      - nitw

  peer0.nitwarangal.nitw.edu:
    container_name: peer0.nitwarangal.nitw.edu
    image: hyperledger/fabric-peer:latest
    labels:
      service: hyperledger-fabric
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=peer0.nitwarangal.nitw.edu
      - CORE_PEER_ADDRESS=peer0.nitwarangal.nitw.edu:${NITWARANGAL_PEER_PORT:-7051}
      - CORE_PEER_LISTENADDRESS=0.0.0.0:${NITWARANGAL_PEER_PORT:-7051}
      - CORE_PEER_CHAINCODEADDRESS=peer0.nitwarangal.nitw.edu:${NITWARANGAL_CHAINCODE_PORT:-7052}
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:${NITWARANGAL_CHAINCODE_PORT:-7052}
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=${NITWARANGAL_HOST:-localhost}:${NITWARANGAL_PEER_PORT:-7051}
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.nitwarangal.nitw.edu:${NITWARANGAL_PEER_PORT:-7051}
      - CORE_PEER_LOCALMSPID=NITWarangalMSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=${DOCKER_NETWORK_NAME:-fabric_nitw}
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:${NITWARANGAL_OPERATIONS_PORT:-9446}
      - CORE_METRICS_PROVIDER=prometheus
      - CHAINCODE_AS_A_SERVICE_BUILDER_CONFIG={"peername":"peer0nitwarangal"}
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb0:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=${COUCHDB_USER:-admin}
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=${COUCHDB_PASSWORD:-adminpw}
    working_dir: /root
    command: sh -c "sleep 10 && peer node start"
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/nitwarangal.nitw.edu/peers/peer0.nitwarangal.nitw.edu/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/nitwarangal.nitw.edu/peers/peer0.nitwarangal.nitw.edu/tls:/etc/hyperledger/fabric/tls
      - peer0.nitwarangal.nitw.edu:/var/hyperledger/production
    ports:
      - ${NITWARANGAL_PEER_PORT:-7051}:${NITWARANGAL_PEER_PORT:-7051}
      - ${NITWARANGAL_OPERATIONS_PORT:-9446}:${NITWARANGAL_OPERATIONS_PORT:-9446}
    extra_hosts:
      - "orderer.nitw.edu:${ORDERER_HOST:-host-gateway}"
      - "peer0.departments.nitw.edu:${DEPARTMENTS_HOST:-host-gateway}"
      - "peer0.verifiers.nitw.edu:${VERIFIERS_HOST:-host-gateway}"
    networks:
      - nitw
    depends_on:
      couchdb0:
        condition: service_started
