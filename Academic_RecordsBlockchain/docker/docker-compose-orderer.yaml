# Copyright NIT Warangal Academic Records Blockchain Network
# Docker Compose: Orderer Organization (Machine 1)
# Usage: docker-compose -f docker-compose-orderer.yaml up -d

version: '3.7'

volumes:
  orderer.nitw.edu:

networks:
  nitw:
    name: ${DOCKER_NETWORK_NAME:-fabric_nitw}

services:
  ca_orderer:
    image: hyperledger/fabric-ca:latest
    labels:
      service: hyperledger-fabric
    command: sh -c 'fabric-ca-server start -b ${CA_ADMIN_USER:-admin}:${CA_ADMIN_PASSWORD:-adminpw} -d'
    environment:
      - FABRIC_CA_SERVER_CA_NAME=ca-orderer
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=${ORDERER_CA_PORT:-7054}
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:${ORDERER_CA_OPERATIONS_PORT:-17054}
      - FABRIC_CA_SERVER_CSR_HOSTS=ca-orderer,localhost,${ORDERER_HOST:-localhost}
      - FABRIC_CA_SERVER_CSR_CN=ca-orderer.nitw.edu
    ports:
      - "${ORDERER_CA_PORT:-7054}:${ORDERER_CA_PORT:-7054}"
      - "${ORDERER_CA_OPERATIONS_PORT:-17054}:${ORDERER_CA_OPERATIONS_PORT:-17054}"
    volumes:
      - ../organizations/fabric-ca/ordererOrg:/etc/hyperledger/fabric-ca-server
    container_name: ca_orderer
    extra_hosts:
      - "peer0.nitwarangal.nitw.edu:${NITWARANGAL_HOST:-host-gateway}"
      - "peer0.departments.nitw.edu:${DEPARTMENTS_HOST:-host-gateway}"
      - "peer0.verifiers.nitw.edu:${VERIFIERS_HOST:-host-gateway}"
    networks:
      - nitw

  orderer.nitw.edu:
    container_name: orderer.nitw.edu
    image: hyperledger/fabric-orderer:latest
    labels:
      service: hyperledger-fabric
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=${ORDERER_PORT:-7050}
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:${ORDERER_ADMIN_PORT:-7053}
      - ORDERER_OPERATIONS_LISTENADDRESS=0.0.0.0:${ORDERER_OPERATIONS_PORT:-9443}
      - ORDERER_METRICS_PROVIDER=prometheus
    working_dir: /root
    command: orderer
    volumes:
      - ../organizations/ordererOrganizations/nitw.edu/orderers/orderer.nitw.edu/msp:/var/hyperledger/orderer/msp
      - ../organizations/ordererOrganizations/nitw.edu/orderers/orderer.nitw.edu/tls:/var/hyperledger/orderer/tls
      - orderer.nitw.edu:/var/hyperledger/production/orderer
    ports:
      - ${ORDERER_PORT:-7050}:${ORDERER_PORT:-7050}
      - ${ORDERER_ADMIN_PORT:-7053}:${ORDERER_ADMIN_PORT:-7053}
      - ${ORDERER_OPERATIONS_PORT:-9443}:${ORDERER_OPERATIONS_PORT:-9443}
    extra_hosts:
      - "peer0.nitwarangal.nitw.edu:${NITWARANGAL_HOST:-host-gateway}"
      - "peer0.departments.nitw.edu:${DEPARTMENTS_HOST:-host-gateway}"
      - "peer0.verifiers.nitw.edu:${VERIFIERS_HOST:-host-gateway}"
    networks:
      - nitw
