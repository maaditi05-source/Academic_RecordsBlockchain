# Copyright NIT Warangal Academic Records Blockchain Network
# Docker Compose: Verifiers Organization (Machine 4)
# Usage: docker-compose -f docker-compose-verifiers.yaml up -d

version: '3.7'

volumes:
  peer0.verifiers.nitw.edu:


networks:
  nitw:
    name: ${DOCKER_NETWORK_NAME:-fabric_nitw}

services:
  ca_verifiers:
    image: hyperledger/fabric-ca:latest
    labels:
      service: hyperledger-fabric
    command: sh -c 'fabric-ca-server start -b ${CA_ADMIN_USER:-admin}:${CA_ADMIN_PASSWORD:-adminpw} -d'
    environment:
      - FABRIC_CA_SERVER_CA_NAME=ca-verifiers
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=${VERIFIERS_CA_PORT:-11054}
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:${VERIFIERS_CA_OPERATIONS_PORT:-21054}
      - FABRIC_CA_SERVER_CSR_HOSTS=ca-verifiers,localhost,${VERIFIERS_HOST:-localhost}
      - FABRIC_CA_SERVER_CSR_CN=ca-verifiers.nitw.edu
    ports:
      - "${VERIFIERS_CA_PORT:-11054}:${VERIFIERS_CA_PORT:-11054}"
      - "${VERIFIERS_CA_OPERATIONS_PORT:-21054}:${VERIFIERS_CA_OPERATIONS_PORT:-21054}"
    volumes:
      - ../organizations/fabric-ca/verifiers:/etc/hyperledger/fabric-ca-server
    container_name: ca_verifiers
    extra_hosts:
      - "orderer.nitw.edu:${ORDERER_HOST:-host-gateway}"
      - "peer0.nitwarangal.nitw.edu:${NITWARANGAL_HOST:-host-gateway}"
      - "peer0.departments.nitw.edu:${DEPARTMENTS_HOST:-host-gateway}"
    networks:
      - nitw

  couchdb2:
    container_name: couchdb2
    image: couchdb:3.3
    environment:
      - COUCHDB_USER=${COUCHDB_USER:-admin}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD:-adminpw}
    ports:
      - "${VERIFIERS_COUCHDB_PORT:-7984}:5984"
    networks:
      - nitw

  peer0.verifiers.nitw.edu:
    container_name: peer0.verifiers.nitw.edu
    image: hyperledger/fabric-peer:latest
    labels:
      service: hyperledger-fabric
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=peer0.verifiers.nitw.edu
      - CORE_PEER_ADDRESS=peer0.verifiers.nitw.edu:${VERIFIERS_PEER_PORT:-11051}
      - CORE_PEER_LISTENADDRESS=0.0.0.0:${VERIFIERS_PEER_PORT:-11051}
      - CORE_PEER_CHAINCODEADDRESS=peer0.verifiers.nitw.edu:${VERIFIERS_CHAINCODE_PORT:-11052}
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:${VERIFIERS_CHAINCODE_PORT:-11052}
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=${VERIFIERS_HOST:-localhost}:${VERIFIERS_PEER_PORT:-11051}
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.verifiers.nitw.edu:${VERIFIERS_PEER_PORT:-11051}
      - CORE_PEER_LOCALMSPID=VerifiersMSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=${DOCKER_NETWORK_NAME:-fabric_nitw}
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:${VERIFIERS_OPERATIONS_PORT:-9450}
      - CORE_METRICS_PROVIDER=prometheus
      - CHAINCODE_AS_A_SERVICE_BUILDER_CONFIG={"peername":"peer0verifiers"}
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb2:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=${COUCHDB_USER:-admin}
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=${COUCHDB_PASSWORD:-adminpw}
    working_dir: /root
    command: sh -c "sleep 10 && peer node start"
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/verifiers.nitw.edu/peers/peer0.verifiers.nitw.edu/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/verifiers.nitw.edu/peers/peer0.verifiers.nitw.edu/tls:/etc/hyperledger/fabric/tls
      - peer0.verifiers.nitw.edu:/var/hyperledger/production
    ports:
      - ${VERIFIERS_PEER_PORT:-11051}:${VERIFIERS_PEER_PORT:-11051}
      - ${VERIFIERS_OPERATIONS_PORT:-9450}:${VERIFIERS_OPERATIONS_PORT:-9450}
    extra_hosts:
      - "orderer.nitw.edu:${ORDERER_HOST:-host-gateway}"
      - "peer0.nitwarangal.nitw.edu:${NITWARANGAL_HOST:-host-gateway}"
      - "peer0.departments.nitw.edu:${DEPARTMENTS_HOST:-host-gateway}"
    networks:
      - nitw
    depends_on:
      couchdb2:
        condition: service_started
