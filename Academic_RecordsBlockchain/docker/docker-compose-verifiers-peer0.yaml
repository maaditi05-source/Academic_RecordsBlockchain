version: '3.7'

# Node 10 — Verifiers Peer 0 (Anchor)
# Roles: External credential verification (VerifiersMSP)
# Machine IP: ${VERI_PEER0_HOST}

networks:
  fabric_net:
    driver: bridge

volumes:
  peer0.verifiers.nitw.edu:
  couchdb.veri0:


services:

  ca_verifiers:
    image: hyperledger/fabric-ca:1.5
    labels:
      service: hyperledger-fabric
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-verifiers
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=${VERI_CA_PORT:-11054}
    ports:
      - "${VERI_CA_PORT:-11054}:${VERI_CA_PORT:-11054}"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ../organizations/fabric-ca/verifiers:/etc/hyperledger/fabric-ca-server
    container_name: ca_verifiers
    networks:
      - fabric_net

  couchdb.veri0:
    container_name: couchdb.veri0
    image: couchdb:3.3
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "${VERI_COUCHDB0_PORT:-5990}:5984"
    networks:
      - fabric_net

  peer0.verifiers.nitw.edu:
    container_name: peer0.verifiers.nitw.edu
    image: hyperledger/fabric-peer:2.5
    labels:
      service: hyperledger-fabric
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fabric_net
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.verifiers.nitw.edu
      - CORE_PEER_ADDRESS=peer0.verifiers.nitw.edu:${VERI_PEER0_PORT:-11051}
      - CORE_PEER_LISTENADDRESS=0.0.0.0:${VERI_PEER0_PORT:-11051}
      - CORE_PEER_CHAINCODEADDRESS=peer0.verifiers.nitw.edu:${VERI_PEER0_CHAINCODE_PORT:-11052}
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:${VERI_PEER0_CHAINCODE_PORT:-11052}
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer1.verifiers.nitw.edu:${VERI_PEER1_PORT:-11151}
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=${VERI_PEER0_HOST:-localhost}:${VERI_PEER0_PORT:-11051}
      - CORE_PEER_LOCALMSPID=VerifiersMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=peer0.verifiers.nitw.edu:17056
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb.veri0:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/verifiers.nitw.edu/peers/peer0.verifiers.nitw.edu/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/verifiers.nitw.edu/peers/peer0.verifiers.nitw.edu/tls:/etc/hyperledger/fabric/tls
      - peer0.verifiers.nitw.edu:/var/hyperledger/production
    working_dir: /root
    command: peer node start
    ports:
      - "${VERI_PEER0_PORT:-11051}:${VERI_PEER0_PORT:-11051}"
    depends_on:
      - couchdb.veri0
    networks:
      - fabric_net
    extra_hosts:
      - "orderer1.nitw.edu:${ORDERER1_HOST:-host-gateway}"
      - "orderer2.nitw.edu:${ORDERER2_HOST:-host-gateway}"
      - "orderer3.nitw.edu:${ORDERER3_HOST:-host-gateway}"
      - "peer0.nitwarangal.nitw.edu:${NITW_PEER0_HOST:-host-gateway}"
      - "peer1.nitwarangal.nitw.edu:${NITW_PEER1_HOST:-host-gateway}"
      - "peer0.cse.departments.nitw.edu:${DEPT_CSE_HOST:-host-gateway}"
      - "peer0.ece.departments.nitw.edu:${DEPT_ECE_HOST:-host-gateway}"
      - "peer0.me.departments.nitw.edu:${DEPT_ME_HOST:-host-gateway}"
      - "peer0.dac.departments.nitw.edu:${DEPT_DAC_HOST:-host-gateway}"
      - "peer1.verifiers.nitw.edu:${VERI_PEER1_HOST:-host-gateway}"
