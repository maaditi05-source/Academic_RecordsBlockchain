version: '3.7'

# Node 08 — Departments ME Peer
# Roles: ME Faculty + HOD approvals
# Machine IP: ${DEPT_ME_HOST}

networks:
  fabric_net:
    driver: bridge

volumes:
  peer0.me.departments.nitw.edu:
  couchdb.me:


services:

  couchdb.me:
    container_name: couchdb.me
    image: couchdb:3.3
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "${DEPT_ME_COUCHDB_PORT:-5988}:5984"
    networks:
      - fabric_net

  peer0.me.departments.nitw.edu:
    container_name: peer0.me.departments.nitw.edu
    image: hyperledger/fabric-peer:2.5
    labels:
      service: hyperledger-fabric
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fabric_net
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.me.departments.nitw.edu
      - CORE_PEER_ADDRESS=peer0.me.departments.nitw.edu:${DEPT_ME_PORT:-9251}
      - CORE_PEER_LISTENADDRESS=0.0.0.0:${DEPT_ME_PORT:-9251}
      - CORE_PEER_CHAINCODEADDRESS=peer0.me.departments.nitw.edu:${DEPT_ME_CHAINCODE_PORT:-9252}
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:${DEPT_ME_CHAINCODE_PORT:-9252}
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.cse.departments.nitw.edu:${DEPT_CSE_PORT:-9051}
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=${DEPT_ME_HOST:-localhost}:${DEPT_ME_PORT:-9251}
      - CORE_PEER_LOCALMSPID=DepartmentsMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=peer0.me.departments.nitw.edu:17054
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb.me:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/departments.nitw.edu/peers/peer0.me.departments.nitw.edu/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/departments.nitw.edu/peers/peer0.me.departments.nitw.edu/tls:/etc/hyperledger/fabric/tls
      - peer0.me.departments.nitw.edu:/var/hyperledger/production
    working_dir: /root
    command: peer node start
    ports:
      - "${DEPT_ME_PORT:-9251}:${DEPT_ME_PORT:-9251}"
    depends_on:
      - couchdb.me
    networks:
      - fabric_net
    extra_hosts:
      - "orderer1.nitw.edu:${ORDERER1_HOST:-host-gateway}"
      - "orderer2.nitw.edu:${ORDERER2_HOST:-host-gateway}"
      - "orderer3.nitw.edu:${ORDERER3_HOST:-host-gateway}"
      - "peer0.nitwarangal.nitw.edu:${NITW_PEER0_HOST:-host-gateway}"
      - "peer0.cse.departments.nitw.edu:${DEPT_CSE_HOST:-host-gateway}"
      - "peer0.ece.departments.nitw.edu:${DEPT_ECE_HOST:-host-gateway}"
      - "peer0.dac.departments.nitw.edu:${DEPT_DAC_HOST:-host-gateway}"
      - "peer0.verifiers.nitw.edu:${VERI_PEER0_HOST:-host-gateway}"
