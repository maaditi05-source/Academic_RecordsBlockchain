# Copyright NIT Warangal Academic Records Blockchain Network
# Docker Compose: Departments Organization (Machine 3)
# Usage: docker-compose -f docker-compose-departments.yaml up -d

version: '3.7'

volumes:
  peer0.departments.nitw.edu:


networks:
  nitw:
    name: ${DOCKER_NETWORK_NAME:-fabric_nitw}

services:
  ca_departments:
    image: hyperledger/fabric-ca:latest
    labels:
      service: hyperledger-fabric
    command: sh -c 'fabric-ca-server start -b ${CA_ADMIN_USER:-admin}:${CA_ADMIN_PASSWORD:-adminpw} -d'
    environment:
      - FABRIC_CA_SERVER_CA_NAME=ca-departments
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=${DEPARTMENTS_CA_PORT:-9054}
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:${DEPARTMENTS_CA_OPERATIONS_PORT:-19054}
      - FABRIC_CA_SERVER_CSR_HOSTS=ca-departments,localhost,${DEPARTMENTS_HOST:-localhost}
      - FABRIC_CA_SERVER_CSR_CN=ca-departments.nitw.edu
    ports:
      - "${DEPARTMENTS_CA_PORT:-9054}:${DEPARTMENTS_CA_PORT:-9054}"
      - "${DEPARTMENTS_CA_OPERATIONS_PORT:-19054}:${DEPARTMENTS_CA_OPERATIONS_PORT:-19054}"
    volumes:
      - ../organizations/fabric-ca/departments:/etc/hyperledger/fabric-ca-server
    container_name: ca_departments
    extra_hosts:
      - "orderer.nitw.edu:${ORDERER_HOST:-host-gateway}"
      - "peer0.nitwarangal.nitw.edu:${NITWARANGAL_HOST:-host-gateway}"
      - "peer0.verifiers.nitw.edu:${VERIFIERS_HOST:-host-gateway}"
    networks:
      - nitw

  couchdb1:
    container_name: couchdb1
    image: couchdb:3.3
    environment:
      - COUCHDB_USER=${COUCHDB_USER:-admin}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD:-adminpw}
    ports:
      - "${DEPARTMENTS_COUCHDB_PORT:-6984}:5984"
    networks:
      - nitw

  peer0.departments.nitw.edu:
    container_name: peer0.departments.nitw.edu
    image: hyperledger/fabric-peer:latest
    labels:
      service: hyperledger-fabric
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=peer0.departments.nitw.edu
      - CORE_PEER_ADDRESS=peer0.departments.nitw.edu:${DEPARTMENTS_PEER_PORT:-9051}
      - CORE_PEER_LISTENADDRESS=0.0.0.0:${DEPARTMENTS_PEER_PORT:-9051}
      - CORE_PEER_CHAINCODEADDRESS=peer0.departments.nitw.edu:${DEPARTMENTS_CHAINCODE_PORT:-9052}
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:${DEPARTMENTS_CHAINCODE_PORT:-9052}
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=${DEPARTMENTS_HOST:-localhost}:${DEPARTMENTS_PEER_PORT:-9051}
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.departments.nitw.edu:${DEPARTMENTS_PEER_PORT:-9051}
      - CORE_PEER_LOCALMSPID=DepartmentsMSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=${DOCKER_NETWORK_NAME:-fabric_nitw}
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:${DEPARTMENTS_OPERATIONS_PORT:-9448}
      - CORE_METRICS_PROVIDER=prometheus
      - CHAINCODE_AS_A_SERVICE_BUILDER_CONFIG={"peername":"peer0departments"}
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb1:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=${COUCHDB_USER:-admin}
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=${COUCHDB_PASSWORD:-adminpw}
    working_dir: /root
    command: sh -c "sleep 10 && peer node start"
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/departments.nitw.edu/peers/peer0.departments.nitw.edu/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/departments.nitw.edu/peers/peer0.departments.nitw.edu/tls:/etc/hyperledger/fabric/tls
      - peer0.departments.nitw.edu:/var/hyperledger/production
    ports:
      - ${DEPARTMENTS_PEER_PORT:-9051}:${DEPARTMENTS_PEER_PORT:-9051}
      - ${DEPARTMENTS_OPERATIONS_PORT:-9448}:${DEPARTMENTS_OPERATIONS_PORT:-9448}
    extra_hosts:
      - "orderer.nitw.edu:${ORDERER_HOST:-host-gateway}"
      - "peer0.nitwarangal.nitw.edu:${NITWARANGAL_HOST:-host-gateway}"
      - "peer0.verifiers.nitw.edu:${VERIFIERS_HOST:-host-gateway}"
    networks:
      - nitw
    depends_on:
      couchdb1:
        condition: service_started
