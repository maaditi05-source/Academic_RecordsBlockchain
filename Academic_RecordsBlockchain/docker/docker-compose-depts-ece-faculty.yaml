version: '3.7'

# Node 10 — Departments ECE Faculty Advisor
# Roles: ECE Faculty creates academic records, submits for approval
# Machine IP: ${DEPT_ECE_FAC_HOST}

networks:
  fabric_net:
    driver: bridge

volumes:
  peer1.ece.departments.nitw.edu:
  couchdb.ece.faculty:


services:

  couchdb.ece.faculty:
    container_name: couchdb.ece.faculty
    image: couchdb:3.3
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "${DEPT_ECE_FAC_COUCHDB_PORT:-5990}:5984"
    networks:
      - fabric_net

  peer1.ece.departments.nitw.edu:
    container_name: peer1.ece.departments.nitw.edu
    image: hyperledger/fabric-peer:2.5
    labels:
      service: hyperledger-fabric
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fabric_net
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer1.ece.departments.nitw.edu
      - CORE_PEER_ADDRESS=peer1.ece.departments.nitw.edu:${DEPT_ECE_FAC_PORT:-9351}
      - CORE_PEER_LISTENADDRESS=0.0.0.0:${DEPT_ECE_FAC_PORT:-9351}
      - CORE_PEER_CHAINCODEADDRESS=peer1.ece.departments.nitw.edu:${DEPT_ECE_FAC_CHAINCODE_PORT:-9352}
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:${DEPT_ECE_FAC_CHAINCODE_PORT:-9352}
      # Gossip bootstrap from anchor peer (peer0.cse)
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.cse.departments.nitw.edu:${DEPT_CSE_HOD_PORT:-9051}
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=${DEPT_ECE_FAC_HOST:-localhost}:${DEPT_ECE_FAC_PORT:-9351}
      - CORE_PEER_LOCALMSPID=DepartmentsMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=peer1.ece.departments.nitw.edu:17055
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb.ece.faculty:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/departments.nitw.edu/peers/peer1.ece.departments.nitw.edu/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/departments.nitw.edu/peers/peer1.ece.departments.nitw.edu/tls:/etc/hyperledger/fabric/tls
      - peer1.ece.departments.nitw.edu:/var/hyperledger/production
    working_dir: /root
    command: peer node start
    ports:
      - "${DEPT_ECE_FAC_PORT:-9351}:${DEPT_ECE_FAC_PORT:-9351}"
    depends_on:
      - couchdb.ece.faculty
    networks:
      - fabric_net
    extra_hosts:
      - "orderer1.nitw.edu:${ORDERER1_HOST:-host-gateway}"
      - "orderer2.nitw.edu:${ORDERER2_HOST:-host-gateway}"
      - "orderer3.nitw.edu:${ORDERER3_HOST:-host-gateway}"
      - "peer0.nitwarangal.nitw.edu:${NITW_PEER0_HOST:-host-gateway}"
      - "peer1.nitwarangal.nitw.edu:${NITW_PEER1_HOST:-host-gateway}"
      - "peer2.nitwarangal.nitw.edu:${NITW_PEER2_HOST:-host-gateway}"
      - "peer0.cse.departments.nitw.edu:${DEPT_CSE_HOD_HOST:-host-gateway}"
      - "peer1.cse.departments.nitw.edu:${DEPT_CSE_FAC_HOST:-host-gateway}"
      - "peer0.ece.departments.nitw.edu:${DEPT_ECE_HOD_HOST:-host-gateway}"
      - "peer0.verifiers.nitw.edu:${VERI_PEER0_HOST:-host-gateway}"
      - "peer1.verifiers.nitw.edu:${VERI_PEER1_HOST:-host-gateway}"
