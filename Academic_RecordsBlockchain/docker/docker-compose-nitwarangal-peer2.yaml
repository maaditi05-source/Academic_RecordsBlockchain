# Node 06 — NITWarangal Peer 2 (Dean Academic)
# Roles: Dean Academic approvals
# Machine IP: ${NITW_PEER2_HOST}


volumes:
  peer2.nitwarangal.nitw.edu:
  couchdb.nitw.peer2:


services:

  couchdb.nitw.peer2:
    container_name: couchdb.nitw.peer2
    network_mode: host
    image: couchdb:3.3
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw

  peer2.nitwarangal.nitw.edu:
    container_name: peer2.nitwarangal.nitw.edu
    network_mode: host
    image: hyperledger/fabric-peer:2.5
    labels:
      service: hyperledger-fabric
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=host
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer2.nitwarangal.nitw.edu
      - CORE_PEER_ADDRESS=peer2.nitwarangal.nitw.edu:${NITW_PEER2_PORT:-7251}
      - CORE_PEER_LISTENADDRESS=0.0.0.0:${NITW_PEER2_PORT:-7251}
      - CORE_PEER_CHAINCODEADDRESS=peer2.nitwarangal.nitw.edu:${NITW_PEER2_CHAINCODE_PORT:-7252}
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:${NITW_PEER2_CHAINCODE_PORT:-7252}
      # Gossip bootstrap from anchor peer (peer0)
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.nitwarangal.nitw.edu:${NITW_PEER0_PORT:-7051}
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=${NITW_PEER2_HOST:-localhost}:${NITW_PEER2_PORT:-7251}
      - CORE_PEER_LOCALMSPID=NITWarangalMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:17251
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=localhost:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/nitwarangal.nitw.edu/peers/peer2.nitwarangal.nitw.edu/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/nitwarangal.nitw.edu/peers/peer2.nitwarangal.nitw.edu/tls:/etc/hyperledger/fabric/tls
      - peer2.nitwarangal.nitw.edu:/var/hyperledger/production
    working_dir: /root
    command: peer node start
    depends_on:
      - couchdb.nitw.peer2
