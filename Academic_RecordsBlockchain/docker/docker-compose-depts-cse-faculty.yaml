# Node 08 — Departments CSE Faculty Advisor
# Roles: CSE Faculty creates academic records, submits for approval
# Machine IP: ${DEPT_CSE_FAC_HOST}


volumes:
  peer1.cse.departments.nitw.edu:
  couchdb.cse.faculty:


services:

  couchdb.cse.faculty:
    container_name: couchdb.cse.faculty
    network_mode: host
    image: couchdb:3.3
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw

  peer1.cse.departments.nitw.edu:
    container_name: peer1.cse.departments.nitw.edu
    network_mode: host
    image: hyperledger/fabric-peer:2.5
    labels:
      service: hyperledger-fabric
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=host
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer1.cse.departments.nitw.edu
      - CORE_PEER_ADDRESS=peer1.cse.departments.nitw.edu:${DEPT_CSE_FAC_PORT:-9151}
      - CORE_PEER_LISTENADDRESS=0.0.0.0:${DEPT_CSE_FAC_PORT:-9151}
      - CORE_PEER_CHAINCODEADDRESS=peer1.cse.departments.nitw.edu:${DEPT_CSE_FAC_CHAINCODE_PORT:-9152}
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:${DEPT_CSE_FAC_CHAINCODE_PORT:-9152}
      # Gossip bootstrap from anchor peer (peer0.cse = HOD)
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.cse.departments.nitw.edu:${DEPT_CSE_HOD_PORT:-9051}
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=${DEPT_CSE_FAC_HOST:-localhost}:${DEPT_CSE_FAC_PORT:-9151}
      - CORE_PEER_LOCALMSPID=DepartmentsMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=peer1.cse.departments.nitw.edu:17053
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=localhost:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/departments.nitw.edu/peers/peer1.cse.departments.nitw.edu/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/departments.nitw.edu/peers/peer1.cse.departments.nitw.edu/tls:/etc/hyperledger/fabric/tls
      - peer1.cse.departments.nitw.edu:/var/hyperledger/production
    working_dir: /root
    command: peer node start
    depends_on:
      - couchdb.cse.faculty
