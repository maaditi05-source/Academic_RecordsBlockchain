# Copyright NIT Warangal Academic Records Blockchain Network

volumes:
  peer1.departments.nitw.edu:

networks:
  nitw:
    name: fabric_nitw

services:

  couchdb_departments1:
    container_name: couchdb_departments1
    image: couchdb:3.3
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "9984:5984"
    networks:
      - nitw

  peer1.departments.nitw.edu:
    container_name: peer1.departments.nitw.edu
    image: hyperledger/fabric-peer:latest
    labels:
      service: hyperledger-fabric
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=peer1.departments.nitw.edu
      - CORE_PEER_ADDRESS=peer1.departments.nitw.edu:9061
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9061
      - CORE_PEER_CHAINCODEADDRESS=peer1.departments.nitw.edu:9062
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9062
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer1.departments.nitw.edu:9061
      - CORE_PEER_LOCALMSPID=DepartmentsMSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_VM_ENDPOINT=unix:///var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fabric_nitw
      - CORE_OPERATIONS_LISTENADDRESS=peer1.departments.nitw.edu:9556
      - CORE_METRICS_PROVIDER=prometheus
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb_departments1:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    working_dir: /root
    command: sh -c "sleep 5 && peer node start"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../organizations/peerOrganizations/departments.nitw.edu/peers/peer1.departments.nitw.edu/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/departments.nitw.edu/peers/peer1.departments.nitw.edu/tls:/etc/hyperledger/fabric/tls
      - peer1.departments.nitw.edu:/var/hyperledger/production
    ports:
      - "9061:9061"
      - "9556:9556"
    networks:
      - nitw
    depends_on:
      couchdb_departments1:
       condition: service_started

    extra_hosts:
      - "orderer1.nitw.edu:${ORDERER1_IP}"
      - "orderer2.nitw.edu:${ORDERER2_IP}"
      - "orderer3.nitw.edu:${ORDERER3_IP}"
      - "peer0.nitwarangal.nitw.edu:${PEER0_NITW_IP}"
      - "peer1.nitwarangal.nitw.edu:${PEER1_NITW_IP}"
      - "peer2.nitwarangal.nitw.edu:${PEER2_NITW_IP}"
      - "peer0.departments.nitw.edu:${PEER0_DEPT_IP}"
      - "peer1.departments.nitw.edu:${PEER1_DEPT_IP}"
      - "peer2.departments.nitw.edu:${PEER2_DEPT_IP}"
      - "peer0.verifiers.nitw.edu:${PEER0_VERIF_IP}"
      - "peer1.verifiers.nitw.edu:${PEER1_VERIF_IP}"
      - "peer2.verifiers.nitw.edu:${PEER2_VERIF_IP}"

