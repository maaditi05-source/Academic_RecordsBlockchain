# Copyright NIT Warangal Academic Records Blockchain Network

volumes:
  peer0.departments.nitw.edu:

networks:
  nitw:
    name: fabric_nitw

services:

  ca_departments:
    image: hyperledger/fabric-ca:latest
    labels:
      service: hyperledger-fabric
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    environment:
      - FABRIC_CA_SERVER_CA_NAME=ca-departments
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=9054
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:19054
      - FABRIC_CA_SERVER_CSR_HOSTS=ca-departments,localhost
      - FABRIC_CA_SERVER_CSR_CN=ca-departments.nitw.edu
    ports:
      - "9054:9054"
      - "19054:19054"
    volumes:
      - ../organizations/fabric-ca/departments:/etc/hyperledger/fabric-ca-server
    container_name: ca_departments
    networks:
      - nitw

  couchdb_departments0:
    container_name: couchdb_departments0
    image: couchdb:3.3
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "8984:5984"
    networks:
      - nitw

  peer0.departments.nitw.edu:
    container_name: peer0.departments.nitw.edu
    image: hyperledger/fabric-peer:latest
    labels:
      service: hyperledger-fabric
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=peer0.departments.nitw.edu
      - CORE_PEER_ADDRESS=peer0.departments.nitw.edu:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.departments.nitw.edu:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.departments.nitw.edu:9051
      - CORE_PEER_LOCALMSPID=DepartmentsMSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_VM_ENDPOINT=unix:///var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fabric_nitw
      - CORE_OPERATIONS_LISTENADDRESS=peer0.departments.nitw.edu:9546
      - CORE_METRICS_PROVIDER=prometheus
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb_departments0:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    working_dir: /root
    command: sh -c "sleep 5 && peer node start"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../organizations/peerOrganizations/departments.nitw.edu/peers/peer0.departments.nitw.edu/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/departments.nitw.edu/peers/peer0.departments.nitw.edu/tls:/etc/hyperledger/fabric/tls
      - peer0.departments.nitw.edu:/var/hyperledger/production
    ports:
      - "9051:9051"
      - "9546:9546"
    networks:
      - nitw
    depends_on:
      couchdb_departments0:
       condition: service_started

    extra_hosts:
      - "orderer1.nitw.edu:${ORDERER1_IP}"
      - "orderer2.nitw.edu:${ORDERER2_IP}"
      - "orderer3.nitw.edu:${ORDERER3_IP}"
      - "peer0.nitwarangal.nitw.edu:${PEER0_NITW_IP}"
      - "peer1.nitwarangal.nitw.edu:${PEER1_NITW_IP}"
      - "peer2.nitwarangal.nitw.edu:${PEER2_NITW_IP}"
      - "peer0.departments.nitw.edu:${PEER0_DEPT_IP}"
      - "peer1.departments.nitw.edu:${PEER1_DEPT_IP}"
      - "peer2.departments.nitw.edu:${PEER2_DEPT_IP}"
      - "peer0.verifiers.nitw.edu:${PEER0_VERIF_IP}"
      - "peer1.verifiers.nitw.edu:${PEER1_VERIF_IP}"
      - "peer2.verifiers.nitw.edu:${PEER2_VERIF_IP}"


  cli_departments:
    container_name: cli_departments
    image: hyperledger/fabric-tools:latest
    labels:
      service: hyperledger-fabric
    tty: true
    stdin_open: true
    environment:
      - GOPATH=/opt/gopath
      - CORE_VM_ENDPOINT=unix:///var/run/docker.sock
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_ID=cli_departments
      - CORE_PEER_ADDRESS=peer0.departments.nitw.edu:9051
      - CORE_PEER_LOCALMSPID=DepartmentsMSP
      - CORE_PEER_TLS_ROOTCERT_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations/peerOrganizations/departments.nitw.edu/peers/peer0.departments.nitw.edu/tls/ca.crt
      - CORE_PEER_MSPCONFIGPATH=/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations/peerOrganizations/departments.nitw.edu/users/Admin@departments.nitw.edu/msp
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: /bin/bash
    volumes:
      - /var/run/:/var/run/
      - ../organizations:/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations
      - ../scripts:/opt/gopath/src/github.com/hyperledger/fabric/peer/scripts/
      - ../channel-artifacts:/opt/gopath/src/github.com/hyperledger/fabric/peer/channel-artifacts
      - ../collections_config.json:/opt/gopath/src/github.com/hyperledger/fabric/peer/collections_config.json
      - ../configtx:/opt/gopath/src/github.com/hyperledger/fabric/peer/configtx
      - ../chaincode-go:/opt/gopath/src/github.com/hyperledger/fabric/peer/chaincode-go
    depends_on:
      - peer0.departments.nitw.edu
    networks:
      - nitw

    extra_hosts:
      - "orderer1.nitw.edu:${ORDERER1_IP}"
      - "orderer2.nitw.edu:${ORDERER2_IP}"
      - "orderer3.nitw.edu:${ORDERER3_IP}"
      - "peer0.nitwarangal.nitw.edu:${PEER0_NITW_IP}"
      - "peer1.nitwarangal.nitw.edu:${PEER1_NITW_IP}"
      - "peer2.nitwarangal.nitw.edu:${PEER2_NITW_IP}"
      - "peer0.departments.nitw.edu:${PEER0_DEPT_IP}"
      - "peer1.departments.nitw.edu:${PEER1_DEPT_IP}"
      - "peer2.departments.nitw.edu:${PEER2_DEPT_IP}"
      - "peer0.verifiers.nitw.edu:${PEER0_VERIF_IP}"
      - "peer1.verifiers.nitw.edu:${PEER1_VERIF_IP}"
      - "peer2.verifiers.nitw.edu:${PEER2_VERIF_IP}"

