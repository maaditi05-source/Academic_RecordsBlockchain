# Copyright NIT Warangal Academic Records Blockchain Network
# Docker Compose configuration for the Departments organization

volumes:
  peer0.departments.nitw.edu:

networks:
  nitw:
    name: fabric_nitw

services:
  ca_departments:
    image: hyperledger/fabric-ca:latest
    labels:
      service: hyperledger-fabric
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    environment:
      - FABRIC_CA_SERVER_CA_NAME=ca-departments
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=9054
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:19054
      - FABRIC_CA_SERVER_CSR_HOSTS=ca-departments,localhost
      - FABRIC_CA_SERVER_CSR_CN=ca-departments.nitw.edu
    ports:
      - "9054:9054"
      - "19054:19054"
    volumes:
      - ../organizations/fabric-ca/departments:/etc/hyperledger/fabric-ca-server
    container_name: ca_departments
    networks:
      - nitw

  couchdb1:
    container_name: couchdb1
    image: couchdb:3.3
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "6984:5984"
    networks:
      - nitw

  peer0.departments.nitw.edu:
    container_name: peer0.departments.nitw.edu
    image: hyperledger/fabric-peer:latest
    labels:
      service: hyperledger-fabric
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=peer0.departments.nitw.edu
      - CORE_PEER_ADDRESS=peer0.departments.nitw.edu:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.departments.nitw.edu:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.departments.nitw.edu:9051
      - CORE_PEER_LOCALMSPID=DepartmentsMSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_VM_ENDPOINT=unix:///var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fabric_nitw
      - CORE_OPERATIONS_LISTENADDRESS=peer0.departments.nitw.edu:9448
      - CORE_METRICS_PROVIDER=prometheus
      - CHAINCODE_AS_A_SERVICE_BUILDER_CONFIG={"peername":"peer0departments"}
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb1:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw

    working_dir: /root
    command: sh -c "sleep 10 && peer node start"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../organizations/peerOrganizations/departments.nitw.edu/peers/peer0.departments.nitw.edu/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/departments.nitw.edu/peers/peer0.departments.nitw.edu/tls:/etc/hyperledger/fabric/tls
      - peer0.departments.nitw.edu:/var/hyperledger/production
    ports:
      - "9051:9051"
      - "9448:9448"
    networks:
      - nitw
    depends_on:
      couchdb1:
       condition: service_started
    # NOTE FOR MULTIHOST: Add extra_hosts mapping other laptop VPN IPs here when bringing up channel
    extra_hosts:
      - "orderer.nitw.edu:100.88.165.33"
      - "peer0.nitwarangal.nitw.edu:100.79.122.76"
      - "peer0.verifiers.nitw.edu:100.88.165.33"
